<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garagem Pit Stop – Controle de Estoque</title>
<style>
:root{--bg:#0a0a0c;--card:#131316;--line:#25252b;--tx:#f4f4f5;--mut:#9b9ba3;--red:#e11d1d;--green:#16a34a;--blue:#2563eb;--orange:#f59e0b;--purple:#9333ea}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;display:flex;min-height:100vh}
button,input,select{font:inherit;color:inherit}
aside{width:250px;background:#0e0e10;border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;flex-shrink:0}
aside img{width:100%;margin:4px 0 12px;filter:drop-shadow(0 2px 8px rgba(225,29,29,.3))}
nav button{width:100%;display:flex;gap:12px;align-items:center;background:none;border:0;padding:12px 14px;border-radius:8px;cursor:pointer;color:#d4d4d8;text-align:left;font-size:15px}
nav button:hover{background:#1b1b1f}
nav button.on{background:linear-gradient(90deg,#c41414,#e11d1d);color:#fff;font-weight:600}
nav button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.sp{flex:1}
main{flex:1;min-width:0}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:#0e0e10;position:sticky;top:0;z-index:5}
#burger{display:none;background:none;border:0;font-size:26px;cursor:pointer}
.user{display:flex;align-items:center;gap:18px}
.bell{position:relative;font-size:22px}
.bell b{position:absolute;top:-6px;right:-8px;background:var(--red);font-size:11px;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.av{width:34px;height:34px;border-radius:50%;background:#2a2a30;display:grid;place-items:center}
#view{padding:20px 22px 40px;max-width:1300px}
.hero{border-radius:12px;overflow:hidden;min-height:190px;padding:28px;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(90deg,#0a0a0c 35%,rgba(10,10,12,.2)),url(hero.jpg) right/cover;border:1px solid var(--line)}
.hero h1{font-size:34px}.hero p{font-size:17px;margin-top:4px}.hero i{color:#d4d4d8;margin-top:12px}
.grid{display:grid;gap:14px;margin-top:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi{display:flex;gap:14px;align-items:center;border-bottom:3px solid var(--c)}
.kpi .ic{width:52px;height:52px;border-radius:12px;background:var(--c);display:grid;place-items:center;font-size:24px}
.kpi strong{font-size:26px;display:block;line-height:1.1}.kpi>div:last-child{min-width:0}
.kpi span{color:var(--mut);font-size:14px}
h2{font-size:18px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:#1a1a1e;border-radius:6px;margin-bottom:6px;gap:10px}
.pill{background:var(--red);padding:3px 10px;border-radius:5px;font-weight:600;font-size:13px;white-space:nowrap}
.pill.g{background:var(--green)}.pill.o{background:var(--orange);color:#111}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.btn{border:0;border-radius:8px;padding:14px 8px;cursor:pointer;font-weight:600;background:var(--red);color:#fff}
.btn.g{background:var(--green)}.btn.b{background:var(--blue)}.btn.p{background:var(--purple)}.btn.d{background:#2a2a30}
.btn.s{padding:6px 12px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut)}
input,select{background:#1a1a1e;border:1px solid var(--line);border-radius:6px;padding:10px}
select option{background:#1a1a1e}
.hint{color:var(--mut);font-size:13px;margin-top:8px}
.ok{color:#4ade80}.er{color:#f87171}
.login{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% -10%,rgba(225,29,29,.45),transparent 60%),linear-gradient(rgba(10,10,12,.78),rgba(10,10,12,.96)),url(hero.jpg) center/cover,var(--bg)}
.login .box{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px;margin:auto}
.login .logo{width:340px;max-width:90%;align-self:center;margin-bottom:-6px;filter:drop-shadow(0 6px 22px rgba(225,29,29,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.8))}
.login .card{padding:28px 26px;border-radius:16px;background:rgba(19,19,22,.88);backdrop-filter:blur(10px);border:1px solid rgba(225,29,29,.4);box-shadow:0 24px 70px rgba(0,0,0,.65)}
.login h2{font-size:24px;margin-bottom:2px}
.sub{color:var(--mut);font-size:14px;margin-bottom:18px}
.login form{grid-template-columns:1fr;gap:14px}
.login input{font-size:16px;padding:13px 14px}
.login label{font-size:14px;color:#d4d4d8}
.fld{position:relative}
.fld input{width:100%;padding-right:46px}
.fld.ic input{padding-left:42px}
.fld .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mut);cursor:pointer;padding:8px;border-radius:6px;display:grid;place-items:center}
.eye:hover{color:#fff}.eye:focus-visible{outline:2px solid var(--orange)}
.login input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(225,29,29,.25);outline:none}
form.inv input{border-color:var(--red)}
.alerta{background:rgba(225,29,29,.15);border:1px solid var(--red);color:#fecaca;border-radius:8px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.btn.entrar{margin-top:6px;padding:15px;font-size:16px;background:linear-gradient(90deg,#b91212,#e11d1d);box-shadow:0 8px 24px rgba(225,29,29,.4)}
.btn.entrar:hover{filter:brightness(1.12)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.bar{height:8px;border-radius:4px;background:var(--red);min-width:4px;margin-top:6px}
.tag{color:var(--mut);font-size:12px;text-align:right}
.lk{background:none;border:0;color:var(--orange);cursor:pointer;text-decoration:underline;padding:6px 0;margin-top:6px}
.pill.b{background:var(--blue)}
.so-mobile{display:none}
.pill.s{background:#facc15;color:#111}
.btn.warn{background:#b45309}
@media(max-width:1000px){.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}}
@media(max-width:760px){aside{position:fixed;left:-260px;z-index:20;transition:left .2s}aside.open{left:0}#burger{display:block}.so-mobile{display:block}.g4{grid-template-columns:1fr}.hero h1{font-size:26px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="login" class="login"></div>
<aside id="side">
  <img id="logoside" alt="Garagem Pit Stop – Oficina Automotiva">
  <nav id="nav"></nav>
  <div class="sp"></div>
  <nav><button onclick="sair()">⎋ Sair</button></nav>
</aside>
<main>
  <header>
    <button id="burger" aria-label="Abrir menu" onclick="side.classList.toggle('open')">☰</button>
    <span></span>
    <div class="user"><span class="bell" title="Estoque baixo">🔔<b id="badge">0</b></span><span class="av">👤</span><span id="uname"></span></div>
  </header>
  <div id="view"></div>
</main>

function grafico() {

  <button class="btn entrar">Criar conta</button></form>`;

function telaAuth() {
  return `<div class="box"><img class="logo" src="${LOGO}" alt="Garagem Pit Stop – Oficina Automotiva">
  <div class="card ${authMsg ? 'shake' : ''}"><h2>Acesse o sistema</h2>
  <p class="sub">Controle de estoque da oficina</p>
  ${authMsg ? `<div class="alerta" role="alert">⚠️ ${esc(authMsg)}</div>` : ''}
  <form class="${authMsg ? 'inv' : ''}" onsubmit="entrar(event)">
    <label>Usuário<div class="fld ic"><span class="i">👤</span><input name="login" required value="${esc(authLogin)}" ${authLogin ? '' : 'autofocus'} autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Digite seu usuário"></div></label>
    ${campoSenha('senha', 'Senha', 'current-password', `${authLogin ? 'autofocus ' : ''}placeholder="Digite sua senha"`, true)}
    <button class="btn entrar">Entrar</button></form>
  <p class="hint">Não tem conta? Peça para um administrador criar o seu acesso.</p></div></div>`;
}

const telas = {
  dashboard() {
    const P = db.produtos, M = db.movs, u = eu();
    const ult = [...M].sort((a, b) => b.data.localeCompare(a.data)).slice(0, 6);
    const custo = P.reduce((s, p) => s + p.qtd * p.custo, 0), venda = P.reduce((s, p) => s + p.qtd * p.preco, 0);
    const porCat = db.cats.map(c => ({n: c.nome, q: P.filter(p => p.cat === c.nome).reduce((s, p) => s + p.qtd, 0)})).sort((a, b) => b.q - a.q).slice(0, 6), maxC = Math.max(1, ...porCat.map(c => c.q));
    const top = P.map(p => ({p, q: M.filter(m => m.pid === p.id && m.tipo === 'saida').reduce((s, m) => s + m.qtd, 0)})).sort((a, b) => b.q - a.q).slice(0, 5);
    const novos = [...P].sort((a, b) => b.id - a.id).slice(0, 5);
    return `<section class="hero"><h1>Bem-vindo, ${esc(u.nome)}!</h1><p>Garagem Pit Stop – Controle de Estoque</p><i>Sua oficina sempre na pista!</i></section>
    <div class="card so-mobile" style="margin-top:14px"><h2>⚡ Ações rápidas</h2><div class="acts"><button class="btn" onclick="ir('estoque')">Cadastrar produto</button><button class="btn g" onclick="ir('movs')">Registrar entrada</button><button class="btn b" onclick="ir('movs')">Registrar saída</button><button class="btn p" onclick="ir('relatorios')">Ver relatórios</button></div></div>
    <div class="grid g4">${kpi('#e11d1d', '📦', P.reduce((s, p) => s + p.qtd, 0), 'Itens no estoque')}${kpi('#16a34a', '⚠️', baixos().length, 'Produtos com estoque baixo')}${kpi('#2563eb', '🛒', M.filter(m => noMes(m, 'saida')).length, 'Saídas no mês')}${kpi('#f59e0b', '📋', M.filter(m => noMes(m, 'entrada')).length, 'Entradas no mês')}</div>
    <div class="grid g4">${kpi('#e11d1d', '💰', brl0(custo), 'Valor em estoque (custo)')}${kpi('#2563eb', '🏷️', brl0(venda), 'Valor de venda potencial')}${kpi('#16a34a', '📈', brl0(venda - custo), 'Lucro potencial')}${kpi('#9333ea', '⛔', P.filter(p => p.qtd === 0).length, 'Produtos sem estoque')}</div>
    <div class="grid g2"><div class="card"><h2>Movimentação de estoque <span class="hint">(verde: entradas · vermelho: saídas)</span></h2>${grafico()}</div>
    <div class="card"><h2>⚠️ Estoque baixo</h2>${baixos().slice(0, 5).map(p => `<div class="row"><span>${esc(p.nome)}</span><span class="pill">${p.qtd} un.</span></div>`).join('') || '<p class="hint">Tudo acima do mínimo.</p>'}<button class="btn d s" onclick="ir('relatorios')">Ver lista de compras</button></div></div>
    <div class="grid g2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Estoque por categoria</h2>${porCat.map(c => `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>${esc(c.n)}</span><span class="tag">${c.q} un.</span></div><div class="bar" style="width:${c.q / maxC * 100}%"></div></div>`).join('')}</div>
    <div class="card"><h2>Mais saídas</h2>${top.map(t => `<div class="row"><span>${t.p.cod} · ${esc(t.p.nome)}</span><span class="pill b">${t.q} un.</span></div>`).join('')}</div></div>
    <div class="grid g2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Últimos produtos cadastrados</h2>${novos.map(p => `<div class="row"><span>${p.cod} · ${esc(p.nome)}</span><span class="tag">por ${quem(p.por)}</span></div>`).join('')}</div>
    <div class="card"><h2>Resumo do sistema</h2><div class="row"><span>Produtos cadastrados</span><strong>${P.length}</strong></div><div class="row"><span>Categorias</span><strong>${db.cats.length}</strong></div><div class="row"><span>Administradores</span><strong>${db.users.length}</strong></div><div class="row"><span>Movimentações registradas</span><strong>${M.length}</strong></div></div></div>
    <div class="card" style="margin-top:14px"><h2>Últimas movimentações</h2>${ult.map(m => `<div class="row"><span class="pill ${m.tipo === 'entrada' ? 'g' : ''}">${m.tipo === 'entrada' ? 'Entrada' : 'Saída'}</span><span>${esc(prod(m.pid)?.nome || '—')} · ${m.qtd} un.</span><span class="tag">${quem(m.por)}<br>${fmt(m.data)}</span></div>`).join('')}</div>`;
  },
  estoque() {
    return `<div class="card"><h2>Cadastrar produto</h2><form id="fp" onsubmit="cadastrar(event)">
      <label>Nome<input name="nome" list="nomes" required autocomplete="off" oninput="autoCompletar(this.value)"></label>
      <datalist id="nomes">${db.produtos.map(p => `<option value="${esc(p.nome)}">`).join('')}</datalist>
      <label>Categoria<select name="cat" required>${db.cats.map(c => `<option>${esc(c.nome)}</option>`).join('')}</select></label>
      <label>Qtd. inicial<input name="qtd" type="number" min="0" value="0" required></label><label>Estoque mínimo<input name="min" type="number" min="0" value="5" required></label>
      <label>Custo (R$)<input name="custo" type="number" step="0.01" min="0" required></label><label>Preço de venda (R$)<input name="preco" type="number" step="0.01" min="0" required></label>
      <button class="btn">Cadastrar produto</button></form><p class="hint" id="avisoprod"></p><p class="hint">${msg}</p></div>
    <div class="card" style="margin-top:14px"><h2>Estoque (${db.produtos.length} produtos)</h2><label style="max-width:340px;margin-bottom:10px">Buscar por nome, código ou categoria<input id="busca" oninput="filtrar(this.value)"></label><div class="scroll"><table id="tb"><tr><th>Código</th><th>Produto</th><th>Categoria</th><th>Qtd</th><th>Mínimo</th><th>Custo</th><th>Venda</th><th>Cadastrado por</th><th></th></tr>
    ${db.produtos.map(p => `<tr data-q="${esc((p.cod + ' ' + p.nome + ' ' + p.cat).toLowerCase())}"><td>${p.cod}</td><td>${esc(p.nome)}</td><td>${esc(p.cat)}</td><td><span class="pill ${p.qtd <= p.min ? '' : 'g'}">${p.qtd}</span></td><td>${p.min}</td><td>${brl(p.custo)}</td><td>${brl(p.preco)}</td><td>${quem(p.por)}</td><td><button class="btn ${pend === 'p' + p.id ? 'warn' : 'd'} s" onclick="excluir(${p.id})">${pend === 'p' + p.id ? 'Confirmar exclusão?' : 'Excluir'}</button></td></tr>`).join('')}</table></div></div>`;
  },
  movs() { return `<div class="grid g2" style="grid-template-columns:1fr 1fr;margin-top:0"><div class="card" style="border-top:3px solid var(--green)"><h2>📥 Registrar entrada</h2>${formMov('entrada')}</div><div class="card" style="border-top:3px solid var(--blue)"><h2>📤 Registrar saída</h2>${formMov('saida')}</div></div>${msg ? `<p class="hint">${msg}</p>` : ''}${listaMov()}`; },
  categorias() {
    return `<div class="card"><h2>Nova categoria</h2><form onsubmit="addCat(event)"><label>Nome da categoria<input name="nome" required></label><button class="btn">Adicionar categoria</button></form><p class="hint">${msg}</p></div>
    <div class="card" style="margin-top:14px"><h2>Categorias (${db.cats.length})</h2><div class="scroll"><table><tr><th>Prefixo</th><th>Categoria</th><th>Produtos</th><th>Itens</th><th>Valor em estoque (custo)</th><th></th></tr>
    ${db.cats.map(c => { const ps = db.produtos.filter(p => p.cat === c.nome); return `<tr><td>${c.pre}</td><td>${esc(c.nome)}</td><td>${ps.length}</td><td>${ps.reduce((s, p) => s + p.qtd, 0)}</td><td>${brl(ps.reduce((s, p) => s + p.qtd * p.custo, 0))}</td><td>${ps.length ? '' : `<button class="btn d s" onclick="delCat('${c.pre}')">Excluir</button>`}</td></tr>`; }).join('')}</table></div></div>`;
  },
  relatorios() {
    const seis = Date.now() - 180 * 864e5;
    const parados = db.produtos.filter(p => !db.movs.some(m => m.pid === p.id && m.tipo === 'saida' && new Date(m.data) > seis));
    const lucro = db.produtos.map(p => ({nome: p.nome, v: db.movs.filter(m => m.pid === p.id && m.tipo === 'saida').reduce((s, m) => s + m.qtd, 0) * (p.preco - p.custo)})).sort((a, b) => b.v - a.v).slice(0, 15);
    return `<div class="card"><h2>🛒 Comprar hoje</h2>${baixos().length ? `<div class="scroll"><table><tr><th>Código</th><th>Produto</th><th>Em estoque</th><th>Mínimo</th><th>Sugestão de compra</th><th>Custo estimado</th></tr>
    ${baixos().map(p => { const s = p.min * 2 - p.qtd; return `<tr><td>${p.cod}</td><td>${esc(p.nome)}</td><td>${p.qtd}</td><td>${p.min}</td><td>${s} un.</td><td>${brl(s * p.custo)}</td></tr>`; }).join('')}</table></div>` : '<p class="hint">Nada abaixo do mínimo.</p>'}</div>
    <div class="grid g2" style="grid-template-columns:1fr 1fr"><div class="card"><h2>Peças paradas (sem saída há 6 meses)</h2>${parados.slice(0, 20).map(p => `<div class="row"><span>${p.cod} · ${esc(p.nome)}</span><span class="pill o">${p.qtd} un.</span></div>`).join('') || '<p class="hint">Nenhuma peça parada.</p>'}</div>
    <div class="card"><h2>Lucro por peça (15 maiores)</h2>${lucro.map(l => `<div class="row"><span>${esc(l.nome)}</span><span class="pill g">${brl(l.v)}</span></div>`).join('')}</div></div>`;
  },
  admins() {
    return `<div class="card"><h2>Cadastrar novo administrador</h2>${formAdmin()}<p class="hint">${msg}</p></div>
    <div class="card" style="margin-top:14px"><h2>Administradores (${db.users.length})</h2><div class="scroll"><table><tr><th>Conta nº</th><th>Nome</th><th>Usuário</th><th>Tipo</th><th>Cadastrado por</th><th>Produtos cadastrados</th>${souSuper() ? '<th>Ações</th>' : ''}</tr>
    ${db.users.map(u => `<tr><td>#${u.num}</td><td>${esc(u.nome)}</td><td>${esc(u.login)}</td><td><span class="pill ${u.super ? 's' : 'b'}">${u.super ? '⭐ Super admin' : 'Admin'}</span></td><td>${u.por ? quem(u.por) : u.num === 1 ? 'Conta inicial' : '—'}</td><td>${db.produtos.filter(p => p.por === u.id).length}</td>${souSuper() ? `<td style="white-space:nowrap">${u.id === sessao ? '<span class="hint">Você</span>' : `${u.super ? '' : `<button class="btn ${pend === 's' + u.id ? 'warn' : 'd'} s" onclick="promover(${u.id})">${pend === 's' + u.id ? 'Confirmar promoção?' : '⭐ Promover a super admin'}</button> `}<button class="btn ${pend === 'u' + u.id ? 'warn' : 'd'} s" onclick="excluirAdmin(${u.id})">${pend === 'u' + u.id ? 'Confirmar exclusão?' : 'Excluir'}</button>`}</td>` : ''}</tr>`).join('')}</table></div>
    <p class="hint">${souSuper() ? 'Como super admin, você pode excluir outras contas e promover administradores a super admin.' : 'Só um super admin pode excluir contas ou promover administradores.'}</p></div>`;
  },
  config() {
    return `<div class="card"><h2>Configurações</h2><p class="hint" style="margin:0 0 14px">Os dados e as contas ficam salvos só neste navegador (localStorage). Projeto de demonstração, sem servidor.</p><button class="btn b" style="max-width:200px" onclick="exportar()">Exportar JSON</button></div>
    <div class="card" style="margin-top:14px;border-color:var(--red)"><h2>⚠️ Restaurar exemplo</h2><p class="hint" style="margin:0 0 14px">Apaga todos os produtos, movimentações, categorias e contas, e volta aos dados de exemplo. Não dá para desfazer. Exige a senha de um super admin.</p>
    <form onsubmit="resetar(event)" style="max-width:520px">${campoSenha('senha', 'Senha do super admin', 'current-password', 'placeholder="Digite a senha"').replace('minlength="6"', 'minlength="1"')}<button class="btn">Apagar tudo e restaurar</button></form><p class="hint">${msg}</p></div>`;
  }
};

function render() {
  const u = eu(); $('#login').style.display = u ? 'none' : 'grid';
  if (!u) { $('#login').innerHTML = telaAuth(); return; }
  $('#uname').textContent = u.nome + (u.super ? ' ⭐' : '');
  $('#nav').innerHTML = MENU.map(([id, ic, nome]) => `<button class="${id === tela ? 'on' : ''}" onclick="ir('${id}')"><span>${ic}</span>${nome}</button>`).join('');
  $('#badge').textContent = baixos().length;
  $('#view').innerHTML = telas[tela]();
}
/* envio dos formulários sem depender do submit do navegador
   (alguns lugares, como pré-visualizações, bloqueiam formulários e aí nada acontecia) */
function enviar(f) { if (f.reportValidity()) f.dispatchEvent(new Event('submit', {cancelable: true})); }
document.addEventListener('click', e => { const b = e.target.closest('form button:not([type=button])'); if (!b) return; e.preventDefault(); enviar(b.form); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('form input')) { e.preventDefault(); enviar(e.target.form); } });
render();
</script>
</body>
</html>
